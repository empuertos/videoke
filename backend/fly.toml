# fly.toml app configuration file generated for videoke

app = 'videoke'
primary_region = 'nrt'

[build]

[http_service]
  internal_port = 3000
  force_https = true
  # 👇 HUWAG PATULUGIN ANG SERVER
  auto_stop_machines = false
  auto_start_machines = true
  # 👇 PANATILIHING GISING ANG 1 SERVER
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024

# 👇 I-MOUNT ANG PERSISTENT DISK PARA HINDI MAWALA ANG SESSIONS.JSON
[mounts]
  source = "videoke_data"
  destination = "/data"