<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0a0512">
  <title>Videoke YouTube — Host</title>
  <script src="/config.js"></script>
  <style>
    :root { --gold:#ffd700; --red:#ff2e55; --bg:#0a0512;
      --card:#16101f; --dim:#8888a0; --green:#4ade80; }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { background:var(--bg); color:#fff; overflow:hidden;
      font-family:-apple-system,'Segoe UI',Roboto,sans-serif;
      height:100vh; width:100vw; }

    /* ⭐ PLAYER WRAPPER */
    #playerWrap { position:fixed; inset:0;
      background:#000; overflow:hidden; }
    #player { position:absolute; inset:0; }
    #player iframe { width:100%; height:100%; display:block;
      border:0; }

    /* Idle screen */
    #idleScreen { position:fixed; inset:0;
      display:flex; flex-direction:column;
      align-items:center; justify-content:center;
      background:radial-gradient(ellipse at center,#1a0033,#0a0512);
      z-index:100; text-align:center; padding:40px; }
    #idleScreen.hidden { display:none; }
    #idleScreen .logo { font-size:72px; font-weight:900;
      background:linear-gradient(135deg,#ffd700,#ff2e55);
      -webkit-background-clip:text;background-clip:text;
      -webkit-text-fill-color:transparent;
      margin-bottom:20px; letter-spacing:-2px; }
    #idleScreen .sub { font-size:20px; color:#a0a0b0;
      margin-bottom:40px; font-weight:500; }

    /* QR overlay */
    #qrOverlay { margin-top:20px;
      padding:30px; background:rgba(0,0,0,0.6);
      border:2px solid var(--gold);
      border-radius:24px; backdrop-filter:blur(20px);
      box-shadow:0 0 60px rgba(255,215,0,0.3); }
    #qrOverlay.hidden { display:none; }
    #qrOverlay .title { font-size:22px; font-weight:800;
      color:var(--gold); margin-bottom:16px; }
    #qrImg { width:260px; height:260px;
      background:#fff; padding:12px; border-radius:16px;
      display:block; }
    #qrCode { font-family:monospace;
      font-size:40px; font-weight:900; color:var(--gold);
      letter-spacing:10px; margin-top:16px;
      text-shadow:0 0 20px rgba(255,215,0,0.6); }
    #qrUrl { font-size:11px; color:#8888a0;
      margin-top:10px; word-break:break-all; max-width:280px; }

    /* Host control panel */
    #hostControls { margin-top:24px; display:flex; gap:10px;
      flex-wrap:wrap; justify-content:center; }
    #hostControls button { padding:12px 24px;
      border:none; border-radius:12px;
      font-size:14px; font-weight:700; cursor:pointer;
      font-family:inherit; color:#fff; }
    #startPartyBtn { background:linear-gradient(135deg,#22c55e,#16a34a); }
    #stopPartyBtn { background:linear-gradient(135deg,#6b7280,#4b5563); }
    #hostControls button:active { transform:scale(0.97); }

    #hostPwBox { margin-top:20px; padding:20px;
      background:rgba(0,0,0,0.6);
      border:1px solid rgba(255,255,255,0.1);
      border-radius:14px; display:none; }
    #hostPwBox.show { display:block; }
    #hostPwBox input { padding:12px 16px;
      background:#1e1630; color:#fff; border:1px solid rgba(255,255,255,0.1);
      border-radius:10px; font-size:15px;
      font-family:inherit; width:220px; text-align:center; }
    #hostPwBox input:focus { outline:none; border-color:var(--gold); }
    #hostPwBox .row { display:flex; gap:8px; margin-top:12px;
      justify-content:center; }
    #hostPwBox .row button { padding:10px 20px;
      border:none; border-radius:10px; font-weight:700;
      cursor:pointer; font-family:inherit; font-size:13px; }
    #hostPwBox .row .primary { background:var(--red); color:#fff; }
    #hostPwBox .row .secondary { background:#1e1630; color:#fff;
      border:1px solid rgba(255,255,255,0.1); }
    #hostPwErr { color:#ff6b6b; font-size:12px;
      margin-top:10px; min-height:14px; }

    /* ⭐ TOP BAR — Now Playing + Reserved side by side (nasa ITAAS) */
    #topBar { position:absolute; top:0; left:0; right:0;
      z-index:50; padding:14px 16px;
      display:none; gap:12px;
      pointer-events:none; }
    #topBar.show { display:flex; }

    /* Now Playing HUD */
    #nowHud { flex:1; padding:12px 20px;
      background:linear-gradient(135deg,rgba(0,0,0,0.88),rgba(42,10,74,0.88));
      border:2px solid rgba(255,215,0,0.4);
      border-radius:14px; backdrop-filter:blur(20px);
      display:flex; align-items:center; gap:14px;
      box-shadow:0 4px 20px rgba(0,0,0,0.5); }
    #nowHud .icon { font-size:28px; flex-shrink:0; }
    #nowHud .info { flex:1; min-width:0; }
    #nowHud .label { font-size:10px; font-weight:800;
      color:var(--gold); letter-spacing:3px; margin-bottom:2px; }
    #nowHud .singer { font-size:20px; font-weight:800;
      overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    #nowHud .song { font-size:13px; color:#c0c0d0;
      overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
      margin-top:2px; }

    /* Reserved HUD — queue list (nasa ITAAS din, katabi ng Now Playing) */
    #queueHud { flex:1; max-width:45%; padding:12px 18px;
      background:linear-gradient(135deg,rgba(0,0,0,0.88),rgba(42,10,10,0.88));
      border:2px solid rgba(255,46,85,0.4);
      border-radius:14px; backdrop-filter:blur(20px);
      display:flex; flex-direction:column;
      box-shadow:0 4px 20px rgba(0,0,0,0.5); }
    #queueHud .label { font-size:10px; font-weight:800;
      color:#ff6b6b; letter-spacing:3px; margin-bottom:6px;
      display:flex; justify-content:space-between; align-items:center; }
    #queueHud .label .count {
      background:#ff2e55; color:#fff; font-size:10px;
      padding:1px 8px; border-radius:10px; letter-spacing:0;
      font-weight:700; }
    #queueHud .items { display:flex; flex-direction:column; gap:4px; }
    #queueHud .q-item { display:flex; align-items:flex-start; gap:8px;
      font-size:12px; line-height:1.2; }
    #queueHud .q-pos { background:var(--gold); color:#000;
      font-size:10px; font-weight:800; min-width:18px; height:18px;
      border-radius:50%; display:flex; align-items:center;
      justify-content:center; flex-shrink:0; margin-top:1px; }
    #queueHud .q-info { flex:1; min-width:0; }
    #queueHud .q-singer { font-weight:800; font-size:12px;
      color:#fff; overflow:hidden; text-overflow:ellipsis;
      white-space:nowrap; }
    #queueHud .q-song { font-size:10px; color:#a0a0b0;
      overflow:hidden; text-overflow:ellipsis;
      white-space:nowrap; margin-top:0px; }
    #queueHud .q-empty { font-size:11px; color:#666; font-style:italic; }
    #queueHud .q-more { font-size:10px; color:#888; font-style:italic;
      margin-top:2px; text-align:right; }

    /* Countdown overlay */
    #countdown { position:absolute; inset:0; z-index:200;
      display:none; align-items:center; justify-content:center;
      background:rgba(0,0,0,0.7); backdrop-filter:blur(10px);
      pointer-events:none; }
    #countdown.show { display:flex; }
    #countdown .num { font-size:200px; font-weight:900;
      color:var(--gold);
      text-shadow:0 0 60px rgba(255,215,0,0.8);
      animation:pulse 1s ease-in-out infinite; }
    @keyframes pulse {
      0%,100% { transform:scale(1); opacity:1; }
      50% { transform:scale(1.1); opacity:0.7; }
    }

    /* Fullscreen button */
    #fsBtn { position:absolute; bottom:20px; right:20px;
      z-index:300;
      width:48px; height:48px; border-radius:12px;
      background:rgba(0,0,0,0.6);
      border:1px solid rgba(255,255,255,0.2);
      color:#fff; font-size:20px; cursor:pointer;
      display:flex; align-items:center; justify-content:center;
      backdrop-filter:blur(20px);
      transition:opacity 0.3s, transform 0.2s; }
    #fsBtn:hover { background:rgba(0,0,0,0.8); transform:scale(1.05); }
    #fsBtn:active { transform:scale(0.95); }
    body.is-fullscreen #fsBtn { opacity:0.4; }
    body.is-fullscreen #fsBtn:hover { opacity:1; }

    /* Connection status */
    #connStatus { position:absolute; bottom:20px; left:20px;
      z-index:60; padding:8px 16px;
      background:rgba(0,0,0,0.7);
      border-radius:20px; font-size:12px;
      display:flex; align-items:center; gap:6px;
      pointer-events:none; }
    #connDot { width:8px; height:8px; border-radius:50%;
      background:var(--green); box-shadow:0 0 10px var(--green); }
    #connDot.offline { background:var(--red); box-shadow:0 0 10px var(--red); }

    body.is-fullscreen #idleScreen { display:none; }
  </style>
</head>
<body>
  <div id="playerWrap">
    <div id="player"></div>

    <!-- ⭐ TOP BAR: Now Playing (left) + Reserved Queue (right) -->
    <div id="topBar">
      <div id="nowHud">
        <div class="icon">🎤</div>
        <div class="info">
          <div class="label">NOW SINGING</div>
          <div class="singer" id="nowSinger">—</div>
          <div class="song" id="nowSong">—</div>
        </div>
      </div>
      <div id="queueHud">
        <div class="label">
          <span>📋 RESERVED</span>
          <span class="count" id="queueCount">0</span>
        </div>
        <div class="items" id="queueItems">
          <div class="q-empty">No reservations</div>
        </div>
      </div>
    </div>

    <!-- Countdown -->
    <div id="countdown">
      <div class="num" id="countdownNum">3</div>
    </div>

    <!-- Connection status -->
    <div id="connStatus">
      <span id="connDot"></span>
      <span id="connText">Connected</span>
    </div>

    <!-- Fullscreen button -->
    <button id="fsBtn" onclick="toggleFullscreen()" title="Fullscreen">
      <span id="fsIcon">⛶</span>
    </button>
  </div>

  <!-- Idle screen with QR -->
  <div id="idleScreen">
    <div class="logo">🎤 VIDEoke</div>
    <div class="sub" id="subText">Let's sing! Scan the QR code to join.</div>
    <div id="qrOverlay" class="hidden">
      <div class="title">📱 Scan to join Videoke</div>
      <img id="qrImg" src="" alt="QR Code">
      <div id="qrCode">------</div>
      <div id="qrUrl"></div>
    </div>
    <div id="noPartyMsg" style="margin-top:20px;color:#8888a0;font-size:14px">
      ⏳ Waiting for the host to start the party...
    </div>

    <div id="hostControls">
      <button id="startPartyBtn" onclick="hostStartParty()">🎉 Start Party</button>
      <button id="stopPartyBtn" onclick="hostStopParty()" style="display:none">🚫 End Party</button>
    </div>

    <div id="hostPwBox">
      <div style="font-size:13px;color:#a0b0c0;margin-bottom:8px">
        Enter admin password:
      </div>
      <input type="password" id="hostPwInput" placeholder="••••••••">
      <div class="row">
        <button class="primary" onclick="hostConfirmPassword()">Confirm</button>
        <button class="secondary" onclick="hostCancelPassword()">Cancel</button>
      </div>
      <div id="hostPwErr"></div>
    </div>
  </div>

  <script src="https://www.youtube.com/iframe_api"></script>
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <script>
    const BACKEND_URL = window.VIDEOKE_CONFIG?.BACKEND_URL || 'http://localhost:3000';
    const API = BACKEND_URL;

    let ytPlayer = null;
    let ytReady = false;
    let currentVideoId = null;
    let errorCheckTimeout = null;
    let lastPartyCode = null;
    let hostAdminToken = null;
    let pendingAdminAction = null;
    let autoFullscreenAttempted = false;

    const urlParams = new URLSearchParams(window.location.search);
    const urlPartyCode = (urlParams.get('party') || '').toUpperCase() || null;
    if (urlPartyCode) console.log('📌 Locked to party code from URL:', urlPartyCode);

    // =====================================================
    // FULLSCREEN
    // =====================================================
    function isFullscreen() {
      return !!(document.fullscreenElement ||
                document.webkitFullscreenElement ||
                document.msFullscreenElement);
    }

    function toggleFullscreen() {
      const wrap = document.getElementById('playerWrap');
      if (!isFullscreen()) {
        const req = wrap.requestFullscreen ||
                    wrap.webkitRequestFullscreen ||
                    wrap.msRequestFullscreen;
        if (req) req.call(wrap).catch(err => {
          console.error('Fullscreen error:', err);
        });
      } else {
        const exit = document.exitFullscreen ||
                     document.webkitExitFullscreen ||
                     document.msExitFullscreen;
        if (exit) exit.call(document).catch(() => {});
      }
    }

    // ⭐ AUTO-FULLSCREEN kapag nag-play
    async function tryAutoFullscreen() {
      if (isFullscreen()) return;
      // Browser policy: kailangan may user gesture. Kaya try lang natin.
      try {
        const wrap = document.getElementById('playerWrap');
        const req = wrap.requestFullscreen ||
                    wrap.webkitRequestFullscreen ||
                    wrap.msRequestFullscreen;
        if (req) {
          await req.call(wrap);
          console.log('✓ Auto-fullscreen entered');
          autoFullscreenAttempted = true;
        }
      } catch (err) {
        // Hindi pwede — kailangan may user gesture. Hintayin na lang.
        console.log('Auto-fullscreen blocked (needs user gesture). Showing hint.');
        if (!autoFullscreenAttempted) {
          showFullscreenHint();
          autoFullscreenAttempted = true;
        }
      }
    }

    function showFullscreenHint() {
      // Ipakita ang maliit na hint sa bottom-left
      const hint = document.createElement('div');
      hint.id = 'fsHint';
      hint.textContent = '🔲 Tap anywhere or press F to go fullscreen';
      hint.style.cssText = `
        position:absolute; bottom:20px; left:50%;
        transform:translateX(-50%);
        padding:10px 20px; background:rgba(255,215,0,0.9);
        color:#000; font-weight:700; font-size:13px;
        border-radius:20px; z-index:400;
        box-shadow:0 4px 20px rgba(255,215,0,0.4);
        animation:pulse 1.5s infinite;
        pointer-events:none;
      `;
      document.getElementById('playerWrap').appendChild(hint);
      // Remove after 6 seconds
      setTimeout(() => { if (hint.parentNode) hint.remove(); }, 6000);
    }

    function handleFullscreenChange() {
      const fs = isFullscreen();
      document.body.classList.toggle('is-fullscreen', fs);
      document.getElementById('fsIcon').textContent = fs ? '✕' : '⛶';
      document.getElementById('fsBtn').title = fs ? 'Exit Fullscreen' : 'Fullscreen';
      console.log('Fullscreen:', fs ? 'ON' : 'OFF');
    }
    document.addEventListener('fullscreenchange', handleFullscreenChange);
    document.addEventListener('webkitfullscreenchange', handleFullscreenChange);
    document.addEventListener('msfullscreenchange', handleFullscreenChange);

    // Unang user interaction — try fullscreen
    let firstInteractionDone = false;
    function handleFirstInteraction() {
      if (firstInteractionDone) return;
      firstInteractionDone = true;
      // Kapag may nag-play na, subukan mag-fullscreen
      if (currentVideoId) tryAutoFullscreen();
    }
    document.addEventListener('click', handleFirstInteraction, { once: false });
    document.addEventListener('touchstart', handleFirstInteraction, { once: false });
    document.addEventListener('keydown', handleFirstInteraction, { once: false });

    // =====================================================
    // SOCKET
    // =====================================================
    const socket = io(BACKEND_URL, {
      transports: ['websocket', 'polling'],
      reconnection: true,
      reconnectionAttempts: 20,
      reconnectionDelay: 2000
    });

    socket.on('connect', () => {
      document.getElementById('connDot').classList.remove('offline');
      document.getElementById('connText').textContent = 'Connected';
      socket.emit('registerHost');
    });
    socket.on('disconnect', () => {
      document.getElementById('connDot').classList.add('offline');
      document.getElementById('connText').textContent = 'Disconnected';
    });

    // =====================================================
    // YOUTUBE IFRAME API
    // =====================================================
    function onYouTubeIframeAPIReady() {
      ytPlayer = new YT.Player('player', {
        height: '100%',
        width: '100%',
        videoId: '',
        playerVars: {
          autoplay: 0,
          controls: 1,
          modestbranding: 1,
          rel: 0,
          fs: 0,
          playsinline: 1,
          iv_load_policy: 3
        },
        events: {
          onReady: () => {
            ytReady = true;
            console.log('✓ YouTube player ready');
          },
          onStateChange: onPlayerStateChange,
          onError: onPlayerError
        }
      });
    }

    function onPlayerStateChange(event) {
      const state = event.data;
      if (state === 0 && currentVideoId) {
        console.log('♪ Song ended');
        socket.emit('songEnded');
      }
      // ⭐ Pag nag-umpisa nang mag-play (state 1 = playing), auto-fullscreen
      if (state === 1 && currentVideoId && !autoFullscreenAttempted) {
        tryAutoFullscreen();
      }
    }

    function onPlayerError(event) {
      const code = event.data;
      console.error('✗ Player error:', code);
      if (!currentVideoId) return;

      if ([2, 5, 100, 101, 150].includes(code)) {
        console.log('🚫 Blacklisting:', currentVideoId);
        socket.emit('videoFailed', {
          videoId: currentVideoId,
          title: document.getElementById('nowSong').textContent || ''
        });
      }
    }

    // =====================================================
    // SOCKET COMMANDS
    // =====================================================
    socket.on('command', cmd => {
      console.log('📡 Command:', cmd);
      switch (cmd.type) {
        case 'play': playVideo(cmd.song); break;
        case 'countdown': showCountdown(cmd.seconds || 3, cmd.song); break;
        case 'countdownTick': updateCountdown(cmd.seconds); break;
        case 'pause': if (ytPlayer && ytReady) ytPlayer.pauseVideo(); break;
        case 'resume': if (ytPlayer && ytReady) ytPlayer.playVideo(); break;
        case 'stop': stopVideo(); break;
        case 'seek': if (ytPlayer && ytReady) ytPlayer.seekTo(cmd.seconds, true); break;
        case 'volume': if (ytPlayer && ytReady) ytPlayer.setVolume(cmd.value); break;
        case 'idle': showIdle(); break;
      }
    });

    socket.on('state', s => {
      updateQueueHud(s);
      if (s.nowPlaying) {
        updateNowHud(s.nowPlaying);
      } else if (!currentVideoId) {
        showIdle();
      }
      if (typeof s.partyActive === 'boolean') {
        updatePartyVisibility(s.partyActive);
        toggleHostButtons(s.partyActive);
      }
    });

    socket.on('partyStatus', ({ active, code }) => {
      updateQR(active, code);
      updatePartyVisibility(active);
      toggleHostButtons(active);
    });

    socket.on('partyChanged', ({ active }) => {
      if (active) {
        fetch(API + '/api/party').then(r => r.json())
          .then(d => { updateQR(d.active, d.code); updatePartyVisibility(true); toggleHostButtons(true); })
          .catch(() => {});
      } else {
        updateQR(false, null); updatePartyVisibility(false); toggleHostButtons(false);
      }
    });

    socket.on('kicked', () => {});

    // =====================================================
    // VIDEO PLAYBACK
    // =====================================================
    function playVideo(song) {
      if (!song || !song.videoId) return;
      if (!ytPlayer || !ytReady) {
        setTimeout(() => playVideo(song), 500);
        return;
      }

      currentVideoId = song.videoId;
      updateNowHud(song);
      hideIdle();

      console.log('▶ Playing:', song.videoId, '-', song.title);
      ytPlayer.loadVideoById(song.videoId);
      ytPlayer.setVolume(80);
      ytPlayer.playVideo();

      // ⭐ Subukang mag-auto-fullscreen agad (pagkatapos ng 500ms)
      setTimeout(() => { tryAutoFullscreen(); }, 500);

      clearTimeout(errorCheckTimeout);
      errorCheckTimeout = setTimeout(() => {
        if (!ytReady || !ytPlayer) return;
        try {
          const state = ytPlayer.getPlayerState();
          if (state === -1 || state === 5) {
            socket.emit('videoFailed', {
              videoId: currentVideoId, title: song.title || ''
            });
          }
        } catch (e) {}
      }, 6000);
    }

    function stopVideo() {
      currentVideoId = null;
      if (ytPlayer && ytReady) ytPlayer.stopVideo();
      document.getElementById('topBar').classList.remove('show');
      showIdle();
      // I-reset para makapag-auto-fullscreen ulit sa susunod
      autoFullscreenAttempted = false;
    }

    // =====================================================
    // HUD UPDATES
    // =====================================================
    function updateNowHud(song) {
      if (!song) return;
      document.getElementById('nowSinger').textContent = song.singer || '—';
      document.getElementById('nowSong').textContent = song.title || song.videoId || '—';
      document.getElementById('topBar').classList.add('show');
    }

    function updateQueueHud(state) {
      const list = state.queue || [];
      const countEl = document.getElementById('queueCount');
      const itemsEl = document.getElementById('queueItems');

      countEl.textContent = list.length;

      if (!list.length) {
        itemsEl.innerHTML = '<div class="q-empty">No reservations</div>';
        document.getElementById('topBar').classList.add('show');
        return;
      }

      const top = list.slice(0, 4);
      itemsEl.innerHTML = top.map((q, i) => `
        <div class="q-item">
          <div class="q-pos">${i + 1}</div>
          <div class="q-info">
            <div class="q-singer">${escapeHtml(q.singer || 'Guest')}</div>
            <div class="q-song">${escapeHtml(q.title || q.videoId || 'Unknown')}</div>
          </div>
        </div>
      `).join('');

      if (list.length > 4) {
        itemsEl.innerHTML += `<div class="q-more">+${list.length - 4} more</div>`;
      }

      document.getElementById('topBar').classList.add('show');
    }

    // =====================================================
    // COUNTDOWN
    // =====================================================
    function showCountdown(seconds, song) {
      updateNowHud(song);
      document.getElementById('countdownNum').textContent = seconds;
      document.getElementById('countdown').classList.add('show');
    }
    function updateCountdown(seconds) {
      if (seconds <= 0) {
        document.getElementById('countdown').classList.remove('show');
      } else {
        document.getElementById('countdownNum').textContent = seconds;
      }
    }

    // =====================================================
    // IDLE / QR
    // =====================================================
    function showIdle() {
      document.getElementById('idleScreen').classList.remove('hidden');
    }
    function hideIdle() {
      document.getElementById('idleScreen').classList.add('hidden');
    }

    function updateQR(active, code) {
      const overlay = document.getElementById('qrOverlay');
      const noPartyMsg = document.getElementById('noPartyMsg');
      const subText = document.getElementById('subText');

      if (!active || !code) {
        overlay.classList.add('hidden');
        noPartyMsg.style.display = 'block';
        subText.textContent = "Waiting for the party to start...";
        lastPartyCode = null;
        return;
      }

      const url = window.location.origin + '/remote.html?party=' + code;
      document.getElementById('qrImg').src =
        'https://api.qrserver.com/v1/create-qr-code/?size=520x520&data=' +
        encodeURIComponent(url);
      document.getElementById('qrCode').textContent = code;
      document.getElementById('qrUrl').textContent = url;
      overlay.classList.remove('hidden');
      noPartyMsg.style.display = 'none';
      subText.textContent = "Let's sing! Scan the QR code to join.";

      if (code !== lastPartyCode) {
        console.log('✓ Synced to party code:', code);
        lastPartyCode = code;
      }
    }

    function updatePartyVisibility(active) {
      if (!active) {
        document.getElementById('topBar').classList.remove('show');
      }
    }

    function toggleHostButtons(active) {
      document.getElementById('startPartyBtn').style.display = active ? 'none' : 'inline-block';
      document.getElementById('stopPartyBtn').style.display = active ? 'inline-block' : 'none';
    }

    // =====================================================
    // HOST START / STOP
    // =====================================================
    function hostStartParty() {
      document.getElementById('hostPwBox').classList.add('show');
      document.getElementById('hostPwInput').value = '';
      document.getElementById('hostPwErr').textContent = '';
      document.getElementById('hostPwInput').focus();
      pendingAdminAction = 'start-party';
    }

    function hostStopParty() {
      if (!hostAdminToken) {
        document.getElementById('hostPwBox').classList.add('show');
        document.getElementById('hostPwInput').value = '';
        document.getElementById('hostPwErr').textContent = '';
        document.getElementById('hostPwInput').focus();
        pendingAdminAction = 'end-party';
        return;
      }
      if (!confirm('End the party? Guests will no longer be able to reserve.')) return;
      doHostAdminAction('end-party');
    }

    async function hostConfirmPassword() {
      const pw = document.getElementById('hostPwInput').value;
      if (!pw) { document.getElementById('hostPwErr').textContent = 'Enter password'; return; }
      document.getElementById('hostPwErr').textContent = 'Checking...';

      try {
        const r = await fetch(API + '/api/admin/login?password=' + encodeURIComponent(pw));
        if (!r.ok) {
          if (r.status === 401) throw new Error('Wrong password');
          throw new Error('Server error ' + r.status);
        }
        const { token } = await r.json();
        hostAdminToken = token;
        localStorage.setItem('videoke:hostAdminToken', token);
        document.getElementById('hostPwBox').classList.remove('show');
        document.getElementById('hostPwErr').textContent = '';

        if (pendingAdminAction) {
          if (pendingAdminAction === 'end-party' &&
              !confirm('End the party? Guests will no longer be able to reserve.')) {
            pendingAdminAction = null; return;
          }
          doHostAdminAction(pendingAdminAction);
          pendingAdminAction = null;
        }
      } catch (e) {
        document.getElementById('hostPwErr').textContent = '❌ ' + e.message;
      }
    }

    function hostCancelPassword() {
      document.getElementById('hostPwBox').classList.remove('show');
      document.getElementById('hostPwErr').textContent = '';
      pendingAdminAction = null;
    }

    async function doHostAdminAction(action) {
      if (!hostAdminToken) return;
      try {
        const r = await fetch(
          API + '/api/admin/' + action + '?token=' + encodeURIComponent(hostAdminToken)
        );
        if (r.status === 401) {
          hostAdminToken = null;
          localStorage.removeItem('videoke:hostAdminToken');
          document.getElementById('hostPwErr').textContent =
            '❌ Session expired. Enter password again.';
          return;
        }
        if (!r.ok) throw new Error('Server error ' + r.status);
        const data = await r.json();
        if (action === 'start-party' && data.code) {
          console.log('🎉 Started party from host:', data.code);
        }
      } catch (e) {
        alert('❌ Host action error\n\n' + e.message);
      }
    }

    // =====================================================
    // AUTO-SYNC
    // =====================================================
    async function syncPartyStatus() {
      try {
        const r = await fetch(API + '/api/party');
        const d = await r.json();
        updateQR(d.active, d.code);
        updatePartyVisibility(d.active);
        toggleHostButtons(d.active);
      } catch (e) {}
    }
    syncPartyStatus();
    setInterval(syncPartyStatus, 5000);

    const savedHostToken = localStorage.getItem('videoke:hostAdminToken');
    if (savedHostToken) hostAdminToken = savedHostToken;

    // =====================================================
    // KEYBOARD SHORTCUTS
    // =====================================================
    document.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT') {
        if (e.key === 'Enter') hostConfirmPassword();
        if (e.key === 'Escape') hostCancelPassword();
        return;
      }
      if (e.key === 'p' || e.key === 'P') {
        if (ytPlayer && ytReady) {
          const state = ytPlayer.getPlayerState();
          if (state === 1) ytPlayer.pauseVideo();
          else ytPlayer.playVideo();
        }
      }
      if (e.key === 's' || e.key === 'S') socket.emit('skip');
      if (e.key === 'f' || e.key === 'F') toggleFullscreen();
    });

    // =====================================================
    // UTIL
    // =====================================================
    function escapeHtml(s) {
      return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }
  </script>
</body>
</html>
