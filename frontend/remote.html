<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#0a0512">
  <title>VIDEoke — Remote</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Videoke">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <script src="/i18n.js"></script>
  <script src="/config.js"></script>

  <style>
    :root {
      --bg: #0a0512;
      --card: #16101f;
      --card-light: #1e1630;
      --border: #2a1f3d;
      --primary: #ff2e55;
      --accent: #ffd700;
      --success: #4ade80;
      --text-main: #ffffff;
      --text-muted: #8888a0;
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      font-family: var(--font-family);
      min-height: 100vh;
      min-height: 100dvh;
      padding-bottom: max(40px, env(safe-area-inset-bottom));
      overscroll-behavior: none;
      -webkit-text-size-adjust: 100%;
    }

    /* HEADER */
    .header {
      position: sticky; top: 0; z-index: 100;
      padding: 16px 20px;
      padding-top: max(16px, env(safe-area-inset-top));
      background: rgba(10, 5, 18, 0.85);
      -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      display: flex; justify-content: space-between; align-items: center;
    }
    .header h1 {
      font-size: 20px; font-weight: 800; letter-spacing: -0.5px;
      background: linear-gradient(135deg, var(--accent), var(--primary));
      -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    }
    .header .status {
      font-size: 12px; color: var(--text-muted);
      display: flex; align-items: center; gap: 6px; margin-top: 4px; font-weight: 500;
    }
    .dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--success); box-shadow: 0 0 8px rgba(74, 222, 128, 0.6);
    }
    .dot.offline { background: var(--primary); box-shadow: 0 0 8px rgba(255, 46, 85, 0.6); }

    .header-actions { display: flex; gap: 8px; }
    .icon-btn {
      background: var(--card); border: 1px solid var(--border);
      color: var(--text-main); width: 40px; height: 40px;
      border-radius: var(--radius-md); font-size: 16px; cursor: pointer;
      display: flex; align-items: center; justify-content: center; transition: all 0.2s;
    }
    .icon-btn:active { background: var(--card-light); transform: scale(0.95); }

    /* CONTAINER */
    .container { padding: 20px; max-width: 600px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }

    /* SINGER INPUT */
    #singerInputGroup { transition: all 0.25s ease; }
    #singerInputGroup.collapsed { display: none; }
    .input-group label {
      display: block; font-size: 12px; font-weight: 600; color: var(--text-muted);
      margin-bottom: 8px; letter-spacing: 0.5px; text-transform: uppercase;
    }
    input[type=text], input[type=password] {
      width: 100%; padding: 14px 16px; font-size: 16px;
      background: var(--card); color: var(--text-main);
      border: 1px solid var(--border); border-radius: var(--radius-md);
      font-family: inherit; transition: border-color 0.2s;
    }
    input:focus { outline: none; border-color: var(--primary); background: var(--card-light); }
    #guestHint { display: none; font-size: 11px; color: var(--text-muted); margin-top: 8px; }
    #guestHint.show { display: block; }

    #singerPill {
      display: none; align-items: center; gap: 8px; padding: 8px 16px;
      background: var(--card); border: 1px solid var(--border);
      border-radius: 20px; width: fit-content; cursor: pointer;
      color: var(--text-main); font-family: inherit; font-size: 14px; transition: all 0.2s;
    }
    #singerPill.show { display: inline-flex; }
    #singerPill:active { background: var(--card-light); transform: scale(0.98); }
    #singerPill .name { font-weight: 600; color: var(--accent); }

    /* RESERVE CARD */
    .yt-card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--radius-lg); padding: 20px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }
    .yt-card .label {
      font-size: 12px; font-weight: 700; letter-spacing: 1px; color: var(--text-muted);
      margin-bottom: 16px; display: flex; align-items: center; gap: 8px; text-transform: uppercase;
    }

    /* MODE TABS */
    .mode-tabs {
      display: flex; gap: 4px; margin-bottom: 16px;
      background: var(--bg); padding: 4px; border-radius: var(--radius-md);
      border: 1px solid var(--border);
    }
    .mode-tab {
      flex: 1; padding: 10px; background: transparent; border: none;
      color: var(--text-muted); font-size: 13px; font-weight: 600;
      border-radius: var(--radius-sm); cursor: pointer; font-family: inherit;
      display: flex; align-items: center; justify-content: center; gap: 6px; transition: all 0.2s;
    }
    .mode-tab.active { background: var(--card-light); color: var(--text-main); }
    .mode-panel { display: none; }
    .mode-panel.active { display: block; animation: fadeIn 0.3s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

    .primary-btn {
      width: 100%; padding: 14px; background: var(--primary); color: #fff;
      border: none; border-radius: var(--radius-md); font-size: 15px; font-weight: 700;
      cursor: pointer; font-family: inherit; transition: background 0.2s; margin-top: 12px;
    }
    .primary-btn:active { background: #e01b40; }
    .primary-btn:disabled { opacity: 0.6; cursor: not-allowed; }

    .yt-hint {
      display: flex; gap: 12px; padding: 16px;
      background: rgba(255, 46, 85, 0.08); border: 1px solid rgba(255, 46, 85, 0.2);
      border-radius: var(--radius-md); font-size: 13px; line-height: 1.5; color: var(--text-muted); margin-top: 16px;
    }
    .yt-hint ol { padding-left: 20px; margin-top: 8px; }
    .yt-hint b { color: var(--text-main); }

    .yt-open-btn {
      width: 100%; padding: 14px; margin-top: 16px;
      background: transparent; color: var(--text-main);
      border: 1px solid var(--border); border-radius: var(--radius-md);
      font-size: 14px; font-weight: 600; cursor: pointer; font-family: inherit;
      display: flex; align-items: center; justify-content: center; gap: 8px; transition: background 0.2s;
    }
    .yt-open-btn:active { background: var(--card-light); }

    /* SEARCH INPUT */
    .search-input-wrap { position: relative; margin-bottom: 12px; }
    .search-input-wrap input { padding-left: 44px; padding-right: 44px; }
    .search-icon {
      position: absolute; left: 16px; top: 50%; transform: translateY(-50%);
      font-size: 16px; pointer-events: none; color: var(--text-muted);
    }
    .search-mic {
      position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
      width: 32px; height: 32px; border-radius: 50%;
      background: var(--card-light); border: none; color: var(--text-main);
      font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s;
    }
    .search-mic.recording { background: var(--primary); animation: pulse 1.2s infinite; }
    @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(255,46,85,0.5); } 70% { box-shadow: 0 0 0 10px rgba(255,46,85,0); } 100% { box-shadow: 0 0 0 0 rgba(255,46,85,0); } }

    /* RESULTS & RECOMMENDATIONS */
    .recommend-title {
      font-size: 12px; font-weight: 700; color: var(--text-muted);
      letter-spacing: 0.5px; text-transform: uppercase; margin: 20px 0 12px;
    }
    .recommend-chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .rec-chip {
      padding: 8px 14px; background: var(--card-light); border: 1px solid var(--border);
      color: var(--text-main); border-radius: 20px; font-size: 13px; font-weight: 600;
      cursor: pointer; font-family: inherit; transition: all 0.2s;
    }
    .rec-chip:active { transform: scale(0.95); background: var(--border); }

    .search-results { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
    .sr-card {
      display: flex; align-items: center; gap: 12px; padding: 10px;
      background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-md);
    }
    .sr-thumb { width: 80px; height: 50px; border-radius: 6px; object-fit: cover; background: #000; }
    .sr-info { flex: 1; min-width: 0; }
    .sr-title { font-size: 13px; font-weight: 600; color: var(--text-main); line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .sr-meta { font-size: 11px; color: var(--text-muted); margin-top: 4px; }
    .sr-add-btn {
      padding: 8px 12px; border-radius: 6px; background: var(--primary); color: #fff;
      border: none; font-size: 12px; font-weight: 700; cursor: pointer; white-space: nowrap;
    }
    .sr-add-btn:active { background: #e01b40; }

    /* NOW PLAYING */
    .now-card {
      background: linear-gradient(135deg, var(--card) 0%, var(--bg) 100%);
      border: 1px solid var(--border); border-radius: var(--radius-lg);
      padding: 20px; display: flex; align-items: center; gap: 16px; position: relative; overflow: hidden;
    }
    .now-card::before {
      content: ''; position: absolute; top: 0; left: 0; width: 4px; height: 100%; background: var(--primary);
    }
    .now-art {
      width: 64px; height: 64px; border-radius: var(--radius-md);
      background: var(--card-light); display: flex; align-items: center; justify-content: center;
      font-size: 24px; flex-shrink: 0;
    }
    .now-info { flex: 1; min-width: 0; }
    .now-label { font-size: 10px; font-weight: 800; color: var(--primary); letter-spacing: 1px; margin-bottom: 4px; display: flex; align-items: center; gap: 4px; }
    .now-singer { font-size: 16px; font-weight: 700; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .now-song { font-size: 13px; color: var(--text-muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* CONTROLS */
    .controls { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
    .ctrl-btn {
      padding: 12px 8px; background: var(--card); border: 1px solid var(--border);
      border-radius: var(--radius-md); color: var(--text-main); font-size: 18px;
      cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 6px; transition: all 0.2s;
    }
    .ctrl-btn:active { background: var(--card-light); transform: scale(0.95); }
    .ctrl-btn .lbl { font-size: 10px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; }
    .ctrl-btn.locked { opacity: 0.4; cursor: not-allowed; position: relative; }
    .ctrl-btn.locked::after { content: '🔒'; position: absolute; top: 4px; right: 6px; font-size: 10px; }

    .volume-row {
      display: flex; align-items: center; gap: 12px; padding: 16px;
      background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-md);
    }
    .volume-row input[type=range] {
      flex: 1; -webkit-appearance: none; height: 4px; background: var(--border); border-radius: 2px; outline: none;
    }
    .volume-row input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none; width: 18px; height: 18px; background: var(--accent); border-radius: 50%; cursor: pointer;
    }
    .volume-row.locked { opacity: 0.4; pointer-events: none; }

    #lockBanner {
      display: none; align-items: center; gap: 12px; padding: 12px 16px;
      background: rgba(255, 215, 0, 0.1); border: 1px solid rgba(255, 215, 0, 0.2);
      border-radius: var(--radius-md); font-size: 13px; color: var(--accent);
    }
    #lockBanner.show { display: flex; }
    #lockBanner button {
      margin-left: auto; padding: 6px 12px; background: var(--accent); color: #000;
      border: none; border-radius: 6px; font-weight: 700; font-size: 11px; cursor: pointer;
    }

    /* TABS & QUEUE */
    .tab-nav {
      display: flex; gap: 4px; background: var(--card); padding: 4px;
      border-radius: var(--radius-md); border: 1px solid var(--border);
      position: sticky; top: 73px; z-index: 90;
    }
    .tab-btn {
      flex: 1; padding: 10px; background: transparent; border: none; color: var(--text-muted);
      font-size: 13px; font-weight: 600; border-radius: var(--radius-sm); cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 6px; transition: all 0.2s;
    }
    .tab-btn.active { background: var(--card-light); color: var(--text-main); }
    .tab-badge { background: var(--primary); color: #fff; font-size: 10px; padding: 2px 6px; border-radius: 10px; }

    .section-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid var(--border);
    }
    .section-header h2 { font-size: 14px; font-weight: 700; color: var(--text-main); }
    .section-header .badge { background: var(--card-light); color: var(--text-muted); font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 10px; }

    .queue-list { display: flex; flex-direction: column; gap: 8px; }
    .queue-item {
      display: flex; align-items: center; gap: 12px; padding: 12px;
      background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-md);
    }
    .queue-item.is-me { border-color: var(--primary); background: rgba(255, 46, 85, 0.05); }
    .queue-item .pos {
      width: 28px; height: 28px; border-radius: 50%; background: var(--card-light);
      color: var(--text-muted); font-size: 12px; font-weight: 700;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .queue-item.is-me .pos { background: var(--primary); color: #fff; }
    .queue-item .info { flex: 1; min-width: 0; }
    .queue-item .singer { font-size: 14px; font-weight: 600; color: #fff; display: flex; align-items: center; gap: 6px; }
    .queue-item .song { font-size: 12px; color: var(--text-muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .me-badge { font-size: 9px; font-weight: 800; background: var(--primary); color: #fff; padding: 2px 6px; border-radius: 4px; }
    .queue-item .actions { display: flex; gap: 4px; }
    .queue-item .actions button { background: transparent; border: none; color: var(--text-muted); font-size: 16px; padding: 4px 8px; cursor: pointer; }
    .queue-item .actions button.q-act.locked { opacity: 0.3; cursor: not-allowed; }

    /* SHARE SECTION */
    #shareSection {
      display: none; background: var(--card); border: 1px solid var(--border);
      border-radius: var(--radius-lg); padding: 24px; text-align: center; margin-top: 8px;
    }
    #shareSection.show { display: block; }
    #shareSection .title { font-size: 14px; font-weight: 700; color: var(--text-main); margin-bottom: 16px; }
    .qr-container { background: #fff; padding: 12px; border-radius: var(--radius-md); display: inline-block; margin-bottom: 16px; }
    #shareQrImg { width: 160px; height: 160px; display: block; }
    .code-value { font-family: ui-monospace, monospace; font-size: 28px; font-weight: 800; color: var(--accent); letter-spacing: 4px; margin-bottom: 20px; }
    .share-btns { display: flex; gap: 8px; margin-bottom: 16px; }
    .share-btns button {
      flex: 1; padding: 12px; border-radius: var(--radius-md); border: none;
      font-size: 13px; font-weight: 700; cursor: pointer; font-family: inherit;
    }
    .share-btns .copy { background: var(--card-light); color: var(--text-main); }
    .share-btns .share { background: var(--primary); color: #fff; }

    /* MODALS & GATE */
    .modal-bg {
      position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 1000;
      display: none; align-items: center; justify-content: center; padding: 20px;
      backdrop-filter: blur(4px);
    }
    .modal-bg.show { display: flex; }
    .modal {
      background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-lg);
      padding: 24px; width: 100%; max-width: 400px; max-height: 90vh; overflow-y: auto;
    }
    .modal h3 { margin-bottom: 16px; font-size: 18px; font-weight: 700; }
    .modal .row { display: flex; gap: 8px; margin-top: 16px; }
    .modal button { flex: 1; padding: 12px; border-radius: var(--radius-md); font-weight: 700; cursor: pointer; font-family: inherit; font-size: 14px; border: none; }
    .modal .primary { background: var(--primary); color: #fff; }
    .modal .secondary { background: var(--card-light); color: var(--text-main); border: 1px solid var(--border); }

    #partyGate {
      display: none; position: fixed; inset: 0; z-index: 9000;
      background: var(--bg); padding: 24px; flex-direction: column;
      align-items: center; justify-content: center; text-align: center;
    }
    #partyGate.show { display: flex; }
    #partyGate h2 { font-size: 24px; font-weight: 800; margin-bottom: 8px; color: #fff; }
    #partyGate p { font-size: 14px; color: var(--text-muted); max-width: 300px; margin-bottom: 24px; line-height: 1.5; }
    #partyGate input { width: 100%; max-width: 280px; padding: 16px; font-size: 24px; letter-spacing: 4px; text-align: center; text-transform: uppercase; font-weight: 800; background: var(--card); border: 2px solid var(--border); border-radius: var(--radius-md); margin-bottom: 16px; color: #fff; }
    #partyGate input:focus { border-color: var(--primary); outline: none; }
    #partyGate button { padding: 14px 40px; background: var(--primary); color: #fff; border: none; border-radius: var(--radius-md); font-size: 16px; font-weight: 700; cursor: pointer; }
    #partyGate .err { color: var(--primary); font-size: 13px; margin-top: 12px; min-height: 18px; font-weight: 600; }

    /* TOAST */
    #toast {
      position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(100px);
      padding: 12px 24px; background: var(--card); border: 1px solid var(--border);
      color: var(--text-main); border-radius: 30px; font-size: 14px; font-weight: 600;
      z-index: 10000; opacity: 0; transition: all 0.3s cubic-bezier(0.68, -0.55, 0.27, 1.55);
      pointer-events: none; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.5);
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    #toast.error { border-color: var(--primary); color: var(--primary); }
    #toast.success { border-color: var(--success); color: var(--success); }

    .empty-state { text-align: center; padding: 24px; color: var(--text-muted); font-size: 13px; }
  </style>
</head>
<body>
  <!-- HEADER -->
  <div class="header">
    <div>
      <h1>🎤 VIDEoke</h1>
      <div class="status">
        <span class="dot" id="statusDot"></span>
        <span id="statusText">Connected</span>
        <span id="headerPartyCode" style="color:var(--accent); font-weight:700; margin-left:4px; display:none;">• ---</span>
      </div>
    </div>
    <div class="header-actions">
      <button class="icon-btn" onclick="toggleLang()" id="langIcon">🌐</button>
      <button class="icon-btn" onclick="openAdmin()">⚙️</button>
    </div>
  </div>

  <div class="container">
    <!-- SINGER INPUT -->
    <div id="singerInputGroup">
      <div class="input-group" id="singerFieldWrap">
        <label>Your Name</label>
        <input type="text" id="singer" placeholder="Enter your name (or leave blank for Guest)" maxlength="30" autocomplete="off">
        <div id="guestHint">💡 Leave blank — we'll assign you a guest number.</div>
      </div>
    </div>
    <button id="singerPill" onclick="editSingerName()">
      <span>🎤</span>
      <span class="name" id="singerPillName">—</span>
      <span>✏️</span>
    </button>

    <!-- RESERVE CARD -->
    <div class="yt-card">
      <div class="label">🎵 Reserve a Song</div>

      <div class="mode-tabs">
        <button class="mode-tab active" data-mode="link" onclick="setMode('link')">🔗 Paste Link</button>
        <button class="mode-tab" data-mode="search" onclick="setMode('search')">🔍 Search Song</button>
      </div>

      <!-- LINK MODE -->
      <div class="mode-panel active" id="panel-link">
        <input type="text" id="ytUrl" placeholder="Paste any YouTube link..." inputmode="url" autocomplete="off">
        <div class="yt-preview" id="ytPreview" style="display:none; align-items:center; gap:12px; margin-top:12px; background:var(--bg); padding:12px; border-radius:var(--radius-md); border:1px solid var(--border);">
          <img id="ytThumb" src="" style="width:80px; height:60px; border-radius:6px; object-fit:cover;">
          <div style="flex:1; min-width:0;">
            <div style="font-size:13px; font-weight:600; color:#fff; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;" id="ytTitle">—</div>
            <div style="font-size:11px; color:var(--text-muted); margin-top:2px;" id="ytAuthor"></div>
          </div>
        </div>
        <button class="primary-btn" onclick="addYouTube()" id="reserveBtn">➕ Reserve Song</button>

        <div class="yt-hint">
          <div style="font-size:18px;">💡</div>
          <div>
            <b>How to reserve:</b>
            <ol>
              <li>Open YouTube App</li>
              <li>Search for the song (e.g. "Song karaoke")</li>
              <li>Tap Share → Copy link</li>
              <li>Paste the link above and hit Reserve</li>
            </ol>
          </div>
        </div>
        <button class="yt-open-btn" onclick="openYouTubeApp()">▶ Open YouTube App</button>
