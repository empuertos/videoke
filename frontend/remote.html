<div class="yt-card">
  <div class="label">🎤 KARAOKE SEARCH</div>

  <!-- Quick actions -->
  <div class="quick-actions">
    <button onclick="searchOnYouTube()" class="qa-btn yt-btn">
      ▶ Buksan sa YouTube
    </button>
    <button onclick="toggleFilters()" class="qa-btn filter-btn">
      ⚙️ Filters
    </button>
  </div>

  <button class="filters-toggle" onclick="toggleFilters()" id="filtersToggle" style="display:none">
    ⚙️ Advanced Filters <span id="filtersArrow">▸</span>
  </button>

  <div class="filters-panel" id="filtersPanel">
    <label class="filter-row">
      <input type="checkbox" id="strictKaraoke" onchange="applyFilters()">
      <span class="filter-check"></span>
      <div class="filter-info">
        <b>Karaoke Only (Strict)</b>
        <small>Kung walang nakita, subukan i-OFF para sa mas maraming results</small>
      </div>
    </label>

    <label class="filter-row">
      <input type="checkbox" id="hdOnly" onchange="applyFilters()">
      <span class="filter-check"></span>
      <div class="filter-info">
        <b>HD Only</b>
        <small>1080p / 4K karaoke versions lang</small>
      </div>
    </label>

    <label class="filter-row">
      <input type="checkbox" id="filterChannels" onchange="applyFilters()">
      <span class="filter-check"></span>
      <div class="filter-info">
        <b>Trusted Channels</b>
        <small>Tanggalin ang low-quality sources</small>
      </div>
    </label>

    <div class="filter-row duration-filter">
      <div class="filter-info" style="flex:1">
        <b>Duration Range</b>
        <small>Tanggalin ang clips at albums</small>
        <div class="duration-inputs">
          <div class="dur-input">
            <label>Min</label>
            <input type="text" id="minDuration" value="2:00"
              maxlength="5" onblur="validateDuration('min')"
              onchange="applyFilters()">
          </div>
          <div class="dur-sep">—</div>
          <div class="dur-input">
            <label>Max</label>
            <input type="text" id="maxDuration" value="12:00"
              maxlength="5" onblur="validateDuration('max')"
              onchange="applyFilters()">
          </div>
        </div>
        <div class="duration-presets">
          <button onclick="setPreset('short')">Short</button>
          <button onclick="setPreset('song')">Song</button>
          <button onclick="setPreset('long')">Long</button>
          <button onclick="setPreset('all')">All</button>
        </div>
      </div>
    </div>

    <button class="filter-reset" onclick="resetFilters()">🔄 Reset Default</button>
    <button class="filter-reset" onclick="relaxAllFilters()"
      style="margin-top:6px;border-color:rgba(74,222,128,0.4);color:#4ade80">
      🔓 I-relax Lahat ng Filters
    </button>
  </div>

  <div style="display:flex;gap:8px;margin-bottom:10px">
    <input type="search" id="ytSearch" placeholder="Hanapin ang kanta..."
      autocomplete="off" style="flex:1">
    <button onclick="doSearch()" id="searchBtn"
      style="padding:0 16px;background:linear-gradient(135deg,#ff2e55,#ff0044);
      border:none;border-radius:12px;color:#fff;font-size:18px;cursor:pointer">
      🔍
    </button>
  </div>

  <div class="karaoke-only-badge">
    🎤 KARAOKE ONLY · <span id="hdModeBadge">HD ON</span>
  </div>

  <div class="active-filters" id="activeFilters"></div>
  <div id="searchResults" class="search-results"></div>

  <div class="yt-divider"><span>o i-paste ang link</span></div>

  <input type="text" id="ytUrl" placeholder="https://youtu.be/..."
    inputmode="url" autocomplete="off">
  <button class="primary-btn" onclick="addYouTube()">➕ I-reserve</button>

  <div class="yt-preview" id="ytPreview">
    <img id="ytThumb" src="" alt="">
    <div class="info">
      <div class="title" id="ytTitle">—</div>
      <div class="author" id="ytAuthor"></div>
    </div>
  </div>

  <div class="yt-hint">
    <div class="icon">💡</div>
    <div>
      Kung wala ang hinahanap mo, i-tap ang
      <b>▶ Buksan sa YouTube</b> para direkta sa YouTube app.
      Tapos i-copy ang link at i-paste sa baba.
    </div>
  </div>
</div>
